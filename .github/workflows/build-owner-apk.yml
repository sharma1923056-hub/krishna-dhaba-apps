
name: Build Owner APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'restaurant-owner-app/**'
      - '.github/workflows/build-owner-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    defaults:
      run:
        working-directory: restaurant-owner-app

    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_RESTAURANT_SLUG: krishna-dhaba
      EXPO_NO_TELEMETRY: '1'
      CI: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Supabase settings
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing GitHub Actions secrets."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: restaurant-owner-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: restaurant-owner-app/android
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk krishna-dhaba-owner.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: krishna-dhaba-owner-apk
          path: restaurant-owner-app/krishna-dhaba-owner.apk
          retention-days: 30
          if-no-files-found: error
